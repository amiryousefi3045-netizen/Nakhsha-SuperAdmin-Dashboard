version: "3.8"

services:
  mongodb:
    image: mongo:7
    container_name: nakhsha-mongodb
    restart: unless-stopped
    command: >
      mongod
      --wiredTigerCacheSizeGB 1
      --wiredTigerCollectionBlockCompressor snappy
      --logpath /var/log/mongodb/mongod.log
      --logappend
      --bind_ip_all
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-nakhsha123}
      MONGO_INITDB_DATABASE: nakhsha
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
      - mongodb-logs:/var/log/mongodb
    networks:
      - nakhsha-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  backend:
    image: omid3179/nakhsha-backend:latest
    container_name: nakhsha-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-nakhsha123}@mongodb:27017/nakhsha?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - nakhsha-network
    volumes:
      - uploads-data:/app/uploads
      - backend-logs:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:5000/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: omid3179/nakhsha-frontend:latest
    container_name: nakhsha-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nakhsha-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:80",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  mongodb-data:
  mongodb-config:
  mongodb-logs:
  uploads-data:
  backend-logs:

networks:
  nakhsha-network:
    driver: bridge
