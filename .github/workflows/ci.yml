name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─────────────────────────────────────────────
  # Backend: lint → test (Jest + MongoDB service)
  # ─────────────────────────────────────────────
  backend:
    name: Backend – lint / test
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Run tests (Jest + coverage gate)
        run: npm run test:coverage
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-for-jest-only
          MONGO_URI: mongodb://localhost:27017/nakhsha_test

      - name: Audit dependencies (high severity)
        # TODO: flip continue-on-error to false once outstanding high-severity
        # advisories have been resolved. Kept non-blocking for now so registry
        # availability issues cannot silently break the pipeline.
        continue-on-error: true
        run: npm audit --audit-level=high

  # ─────────────────────────────────────────────
  # Frontend: lint → typecheck → build (Vite)
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend – lint / typecheck / build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check (tsc --noEmit)
        run: npm run typecheck

      - name: Build production bundle (Vite)
        run: npm run build

  # ─────────────────────────────────────────────
  # E2E (Playwright): backend + frontend + MongoDB
  # ─────────────────────────────────────────────
  e2e:
    name: End-to-end – Playwright
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers (Chromium)
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: ./frontend
        run: npm run test:e2e
        env:
          CI: "true"
          JWT_SECRET: ci-e2e-secret-for-playwright-only
          MONGODB_URI: mongodb://localhost:27017/nakhsha_e2e
