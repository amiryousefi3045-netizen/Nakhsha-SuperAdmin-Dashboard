version: "3.8"

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: nakhsha-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-nakhsha123}
      MONGO_INITDB_DATABASE: nakhsha
    # Production-ready MongoDB configuration
    command: >
      mongod
      --wiredTigerCacheSizeGB 1
      --wiredTigerCollectionBlockCompressor snappy
      --logappend
      --logpath /var/log/mongodb/mongod.log
      --bind_ip_all
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
      - mongodb-logs:/var/log/mongodb
    networks:
      - nakhsha-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nakhsha-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
    volumes:
      - ./backend/logs:/app/logs
      - uploads-data:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - nakhsha-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:5000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nakhsha-frontend
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      VITE_API_BASE: /api
      VITE_SERVER_ORIGIN: http://localhost:5000
    depends_on:
      - backend
    networks:
      - nakhsha-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  mongodb-data:
    name: nakhsha-mongodb-data
  mongodb-config:
    name: nakhsha-mongodb-config
  mongodb-logs:
    name: nakhsha-mongodb-logs
  uploads-data:
    name: nakhsha-uploads-data
    driver: local

networks:
  nakhsha-network:
    name: nakhsha-network
    driver: bridge
