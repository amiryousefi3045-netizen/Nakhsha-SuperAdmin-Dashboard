version: "3.8"

# ═══════════════════════════════════════════════════
# Nakhsha - Docker Compose برای aaPanel
# ═══════════════════════════════════════════════════
# این فایل 3 سرویس را اجرا می‌کند:
#   1. MongoDB (دیتابیس) - ایمیج رسمی از Docker Hub
#   2. Backend (API) - ایمیج شما از Docker Hub
#   3. Frontend (وب) - ایمیج شما از Docker Hub
# ═══════════════════════════════════════════════════

services:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 🗄️ سرویس 1: MongoDB (دیتابیس)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # این سرویس دیتابیس است - خودکار از Docker Hub دانلود می‌شود
  mongodb:
    image: mongo:7
    container_name: nakhsha-mongodb
    restart: always
    environment:
      # تنظیمات اولیه MongoDB
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-nakhsha123}
      MONGO_INITDB_DATABASE: nakhsha
    volumes:
      # داده‌های دیتابیس اینجا ذخیره می‌شود (حتی بعد از restart حفظ می‌شود)
      - mongodb-data:/data/db
    networks:
      - nakhsha-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # ⚙️ سرویس 2: Backend (Node.js API)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # این ایمیج را شما ساخته‌اید و به Docker Hub push کرده‌اید
  backend:
    image: omid3179/nakhsha-backend:latest
    container_name: nakhsha-backend
    restart: always
    ports:
      - "5000:5000" # API روی پورت 5000 در دسترس است
    environment:
      NODE_ENV: production
      PORT: 5000
      # ⚠️ توجه: نام 'mongodb' باید با نام سرویس بالا یکسان باشد
      MONGODB_URI: mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-nakhsha123}@mongodb:27017/nakhsha?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    depends_on:
      mongodb:
        condition: service_healthy # صبر می‌کند تا MongoDB آماده شود
    networks:
      - nakhsha-network
    volumes:
      # فایل‌های آپلود شده اینجا ذخیره می‌شوند
      - uploads-data:/app/uploads
      - backend-logs:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:5000/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 🌐 سرویس 3: Frontend (React + nginx)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # این ایمیج را شما ساخته‌اید و به Docker Hub push کرده‌اید
  frontend:
    image: omid3179/nakhsha-frontend:latest
    container_name: nakhsha-frontend
    restart: always
    ports:
      - "80:80" # وب‌سایت روی پورت 80 (HTTP)
      - "443:443" # برای HTTPS (بعداً با SSL)
    depends_on:
      backend:
        condition: service_healthy # صبر می‌کند تا Backend آماده شود
    networks:
      - nakhsha-network

# ═══════════════════════════════════════════════════
# تعریف Volumes (فضای ذخیره‌سازی دائمی)
# ═══════════════════════════════════════════════════
volumes:
  mongodb-data: # داده‌های MongoDB
    driver: local
  uploads-data: # فایل‌های آپلود شده کاربران
    driver: local
  backend-logs: # لاگ‌های Backend
    driver: local

# ═══════════════════════════════════════════════════
# تعریف Network (شبکه داخلی بین containerها)
# ═══════════════════════════════════════════════════
networks:
  nakhsha-network:
    driver: bridge

# ═══════════════════════════════════════════════════
# 🚀 دستورات اجرا
# ═══════════════════════════════════════════════════
# برای اجرا:
#   docker-compose -f docker-compose.aapanel.yml --env-file .env.production up -d
#
# برای بررسی وضعیت:
#   docker-compose -f docker-compose.aapanel.yml ps
#
# برای مشاهده لاگ‌ها:
#   docker-compose -f docker-compose.aapanel.yml logs -f
#
# برای restart:
#   docker-compose -f docker-compose.aapanel.yml restart
#
# برای توقف:
#   docker-compose -f docker-compose.aapanel.yml down
# ═══════════════════════════════════════════════════
